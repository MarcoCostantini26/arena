<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #FF0000; 
        }
        .btn { 
            position: absolute; top: 20px; 
            padding: 15px 30px; font-size: 24px; font-weight: bold; 
            cursor: pointer; background: #333; color: white; 
            border: 3px solid white; z-index: 10; border-radius: 10px; 
            font-family: sans-serif; box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
            transition: all 0.3s ease; /* Effetto fluido */
            opacity: 0.8;
        }
        .btn:hover { opacity: 1; }
        #btn-fs { left: 20px; }
        #btn-traffic { right: 20px; }

        /* ========================================== */
        /* STILI QUANDO IL BROWSER E' IN FULL SCREEN  */
        /* ========================================== */
        :fullscreen .btn {
            padding: 5px 10px; 
            font-size: 12px; 
            top: 10px;
            border-width: 1px;
            opacity: 0.2; /* Diventano leggerissimi per non ingannare il robot */
        }
        :fullscreen .btn:hover {
            opacity: 1; /* Tornano visibili se ci passi sopra col mouse */
        }
        
        /* Prefissi per compatibilità con Chrome/Edge/Safari */
        :-webkit-full-screen .btn {
            padding: 5px 10px; font-size: 12px; top: 10px; border-width: 1px; opacity: 0.2;
        }
        :-webkit-full-screen .btn:hover { opacity: 1; }
    </style>
</head>
<body>
    
    <button id="btn-fs" class="btn" onclick="toggleFullScreen()">FULL SCREEN</button>
    <button id="btn-traffic" class="btn" onclick="toggleTraffic()">ATTIVA TRAFFICO (BIANCO)</button>
    
    <!-- Pista in scala 1920x1080 (Full HD) -->
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
        
        <!-- Sfondo (Muro Esterno Globale RED) -->
        <rect width="1920" height="1080" fill="#FF0000" />
        
        <!-- Isola Centrale (Muro Interno Principale BLUE) -->
        <rect x="300" y="200" width="1300" height="650" fill="#0000FF" />
        
        <!-- Isola Interna della Serpentina (Muro RED per correggere le curve interne) -->
        <rect x="700" y="200" width="500" height="450" fill="#FF0000" />

        <!-- ========================================== -->
        <!-- BORDATURE NERE DI QUARANTENA (Largo 180px) -->
        <!-- ========================================== -->
        
        <!-- Main Loop (Il giro esterno) -->
        <path d="M 300 850 L 300 200 L 1600 200 L 1600 850 Z" stroke="#000000" stroke-width="180" fill="none" stroke-linejoin="miter" />
        <!-- Serpentina (Deviazione a U) -->
        <path d="M 700 200 L 700 650 L 1200 650 L 1200 200" stroke="#000000" stroke-width="180" fill="none" stroke-linejoin="miter" />

        <!-- ========================================== -->
        <!-- CORSIA VERDE DI MARCIA (Larga 100px)       -->
        <!-- ========================================== -->
        
        <!-- Main Loop -->
        <path d="M 300 850 L 300 200 L 1600 200 L 1600 850 Z" stroke="#00FF00" stroke-width="100" fill="none" stroke-linejoin="miter" />
        <!-- Serpentina -->
        <path d="M 700 200 L 700 650 L 1200 650 L 1200 200" stroke="#00FF00" stroke-width="100" fill="none" stroke-linejoin="miter" />

        <!-- ========================================== -->
        <!-- MARKER SEMANTICI                           -->
        <!-- ========================================== -->

        <!-- Marker Gialli (Fork a sx, Merge a dx) -->
        <line x1="700" y1="120" x2="700" y2="280" stroke="#FFFF00" stroke-width="120" />
        <line x1="1200" y1="120" x2="1200" y2="280" stroke="#FFFF00" stroke-width="120" />

        <!-- Traguardo Magenta in basso -->
        <line x1="950" y1="770" x2="950" y2="930" stroke="#FF00FF" stroke-width="120" />

        <!-- Traffico Bianco (Sulla scorciatoia in alto, tra i due bivi) -->
        <line id="traffic-zone" x1="800" y1="200" x2="1100" y2="200" stroke="#FFFFFF" stroke-width="100" visibility="hidden" />
    </svg>

    <script>
        function toggleFullScreen() {
            var fsBtn = document.getElementById('btn-fs');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    fsBtn.innerText = "ESCI DA FULL SCREEN";
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().then(() => {
                        fsBtn.innerText = "FULL SCREEN";
                    });
                }
            }
        }

        function toggleTraffic() {
            var tz = document.getElementById('traffic-zone');
            var btn = document.getElementById('btn-traffic');
            if (tz.getAttribute('visibility') === 'hidden') {
                tz.setAttribute('visibility', 'visible');
                btn.innerText = 'DISATTIVA TRAFFICO';
                btn.style.backgroundColor = 'white';
                btn.style.color = 'black';
            } else {
                tz.setAttribute('visibility', 'hidden');
                btn.innerText = 'ATTIVA TRAFFICO (BIANCO)';
                btn.style.backgroundColor = '#333';
                btn.style.color = 'white';
            }
        }
    </script>
</body>
</html>
